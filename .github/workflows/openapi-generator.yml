name: OpenAPI Generator

on:
  push:
    branches: [main]
    paths:
      - "pkg/http/**"
      - "cmd/generate_open_api_spec/**"
      - "pkg/openapi/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25
          cache-dependency-path: go.sum

      - name: Generate OpenAPI specification
        run: |
          echo "Generating OpenAPI specification..."
          go run cmd/generate_open_api_spec/main.go

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "OpenAPI specification has been updated"
            git status --porcelain
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to OpenAPI specification"
          fi

      - name: Commit updated OpenAPI spec
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add api/generated_open_api.json
          git commit -m "(generate) OpenAPI specification

          Generated from changes in pkg/http packages.

          Co-authored-by: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"
          git push

      - name: Generate OpenAPI Test Cases
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          echo "Generating OpenAPI test cases..."
          go run cmd/generate_open_api_test/main.go

      - name: Commit updated OpenAPI test cases
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add api/generated_open_api_test_cases.json
          git commit -m "(generate) OpenAPI test cases

          Generated from changes to OpenAPI specification.

          Co-authored-by: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"
          git push
