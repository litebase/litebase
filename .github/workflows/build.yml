name: build
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
	strategy:
		fail-fast: true
		matrix:
			platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.24'

      - name: Build
        run: go build -v ./...
