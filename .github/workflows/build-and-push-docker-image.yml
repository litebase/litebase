name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      project_name:
        description: "Project name for tagging the Docker image"
        required: true
        type: string
      version:
        description: "Version tag for the Docker image"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
    secrets:
      DOCKERHUB_USERNAME:
        description: "DockerHub username"
        required: false
      DOCKERHUB_TOKEN:
        description: "DockerHub authentication token"
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pre-built binaries
        uses: actions/download-artifact@v4
        with:
          path: ./binaries
          pattern: ${{ inputs.project_name }}-*
          merge-multiple: false

      - name: Extract binaries
        run: |
          mkdir -p ./extracted-binaries/linux ./extracted-binaries/windows

          # Remove 'v' prefix from version if present for matching artifact names
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"

          echo "Looking for artifacts with version: $VERSION"
          echo "Contents of ./binaries:"
          ls -la ./binaries/

          # Extract Linux amd64 binary
          AMD64_ARTIFACT="./binaries/${{ inputs.project_name }}-${VERSION}-linux-x86_64"
          if [ -d "$AMD64_ARTIFACT" ]; then
            echo "Found Linux amd64 artifact: $AMD64_ARTIFACT"
            tar -xzf "$AMD64_ARTIFACT/${{ inputs.project_name }}-${VERSION}-linux-x86_64.tar.gz" -C ./extracted-binaries/linux/
            mv ./extracted-binaries/linux/${{ inputs.project_name }} ./extracted-binaries/linux/${{ inputs.project_name }}-amd64
          else
            echo "ERROR: Linux amd64 artifact not found at $AMD64_ARTIFACT"
            exit 1
          fi

          # Extract Linux arm64 binary
          ARM64_ARTIFACT="./binaries/${{ inputs.project_name }}-${VERSION}-linux-arm64"
          if [ -d "$ARM64_ARTIFACT" ]; then
            echo "Found Linux arm64 artifact: $ARM64_ARTIFACT"
            tar -xzf "$ARM64_ARTIFACT/${{ inputs.project_name }}-${VERSION}-linux-arm64.tar.gz" -C ./extracted-binaries/linux/
            mv ./extracted-binaries/linux/${{ inputs.project_name }} ./extracted-binaries/linux/${{ inputs.project_name }}-arm64
          else
            echo "ERROR: Linux arm64 artifact not found at $ARM64_ARTIFACT"
            exit 1
          fi

          # Extract Windows binary (if exists - optional for now)
          WINDOWS_ARTIFACT="./binaries/${{ inputs.project_name }}-${VERSION}-windows-x86_64"
          if [ -d "$WINDOWS_ARTIFACT" ]; then
            echo "Found Windows artifact: $WINDOWS_ARTIFACT"
            tar -xzf "$WINDOWS_ARTIFACT/${{ inputs.project_name }}-${VERSION}-windows-x86_64.tar.gz" -C ./extracted-binaries/windows/
            mv ./extracted-binaries/windows/${{ inputs.project_name }}.exe ./extracted-binaries/windows/${{ inputs.project_name }}-amd64.exe
          else
            echo "Windows artifact not found (optional): $WINDOWS_ARTIFACT"
          fi

          echo "Extracted binaries:"
          ls -lah ./extracted-binaries/*/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: |
            litebase/litebase
            ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64,windows/amd64
          build-args: |
            VERSION=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
